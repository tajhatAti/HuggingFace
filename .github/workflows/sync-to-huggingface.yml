name: Deploy to Hugging Face

on:
  push:
    branches:
      - main
      - arena/01a00b5b-huggingface
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: true

env:
  HF_SPACE_ID: madarauchihagmailcom/My

jobs:
  deploy:
    name: Sync Gradio Space
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate source and safety tests
        run: |
          python -m pip install --quiet "requests>=2.32.0,<3.0.0"
          python -m unittest discover -s tests -v
          python -m compileall -q app.py code_assistant scripts tests

      - name: Install current Hugging Face CLI
        run: |
          python -m pip install --quiet "huggingface_hub>=1.19.0,<2.0.0"

      - name: Mirror files to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ env.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
          private: false

      - name: Request free ZeroGPU hardware
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ env.HF_SPACE_ID }}
        run: |
          python scripts/configure_space.py
