name: Build Lyr Android APK

on:
  push:
    branches:
      - "arena/01a00b5b-huggingface"
    paths:
      - "android/**"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lyr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Allow Gradle wrapper to run
        working-directory: android
        run: chmod +x gradlew

      - name: Run Android tests and build APK
        working-directory: android
        run: |
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: lyr-online-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "lyr-online-${{ github.run_number }}"
          name: "Lyr Online APK Build ${{ github.run_number }}"
          body: |
            Automatic installable Android build of Lyr Online.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Download app-debug.apk below and install it on the Android phone.
          draft: false
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
